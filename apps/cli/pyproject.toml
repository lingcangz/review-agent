[project]
name = "review-agent-cli"
version = "0.1.0"
description = "Cross-platform client for the Review Agent API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "bandit>=1.8,<2.0",
]

[project.scripts]
review-agent = "review_agent_cli.main:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.9,<1.0",
]

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
