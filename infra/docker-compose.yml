services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: review_agent
      POSTGRES_USER: review_agent
      POSTGRES_PASSWORD: review_agent
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U review_agent -d review_agent']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.26
    ports:
      - '2525:1025'
      - '8025:8025'

volumes:
  postgres_data:
